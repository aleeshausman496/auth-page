<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Signup</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      font-weight: 400;
    }
  </style>
</head>

<body class="bg-gradient-to-b from-purple-400 to-blue-300 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm text-center">

  
    <div class="flex justify-center mb-6">
      <div class="relative w-16 h-16 rounded-full border-2 border-white flex items-center justify-center">

        <div class="w-4 h-4 bg-white rounded-full"></div>

        <div class="absolute bottom-3 w-8 h-4 border-t-2 border-white rounded-full"></div>

      </div>
    </div>

    
    <h2 class="text-white text-3xl sm:text-4xl font-light mb-8 tracking-wide">
      Create Account
    </h2>

    
    <div class="mb-6">
      <input
        type="text"
        placeholder="Full Name"
        class="w-full bg-transparent border-b border-white outline-none text-white placeholder-white/70 pb-2">
    </div>

    
    <div class="mb-6">
      <input
        type="email"
        placeholder="Email ID"
        class="w-full bg-transparent border-b border-white outline-none text-white placeholder-white/70 pb-2">
    </div>

    
    <div class="mb-6">
      <input
        type="password"
        placeholder="Password"
        class="w-full bg-transparent border-b border-white outline-none text-white placeholder-white/70 pb-2">
    </div>

    
    <div class="mb-6">
      <input
        type="password"
        placeholder="Confirm Password"
        class="w-full bg-transparent border-b border-white outline-none text-white placeholder-white/70 pb-2">
    </div>

    
    <button
      type="button"
      onclick="window.location.href='login.html';"
      class="w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700 transition">

      SIGN UP

    </button>

    
    <div class="mt-6 text-white text-sm">
      Already have an account?
      <a href="login.html" class="underline">
        Login
      </a>
    </div>

  </div>

</body>
</html>
