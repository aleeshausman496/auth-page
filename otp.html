<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OTP Verification</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      font-weight: 400;
    }
  </style>
</head>

<body class="bg-gradient-to-b from-purple-400 to-blue-200 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm px-6 py-8 rounded-2xl
              bg-white/10 backdrop-blur-xl
              shadow-xl border border-white/20
              text-center">

    <!-- Title -->
    <h2 class="text-white text-3xl sm:text-4xl font-light mb-2 tracking-wide">
      Verify OTP
    </h2>

    <!-- Subtitle -->
    <p class="text-white/70 text-sm sm:text-base mb-8">
      Enter the 4-digit code sent to your email
    </p>

    <!-- OTP Inputs -->
    <div class="flex justify-between gap-2 mb-8">

      <input type="text" maxlength="1"
        class="w-10 h-10 sm:w-12 sm:h-12 text-center text-white text-xl
               bg-transparent border border-white/40 rounded-lg
               focus:border-white outline-none transition">

      <input type="text" maxlength="1"
        class="w-10 h-10 sm:w-12 sm:h-12 text-center text-white text-xl
               bg-transparent border border-white/40 rounded-lg
               focus:border-white outline-none transition">

      <input type="text" maxlength="1"
        class="w-10 h-10 sm:w-12 sm:h-12 text-center text-white text-xl
               bg-transparent border border-white/40 rounded-lg
               focus:border-white outline-none transition">

      <input type="text" maxlength="1"
        class="w-10 h-10 sm:w-12 sm:h-12 text-center text-white text-xl
               bg-transparent border border-white/40 rounded-lg
               focus:border-white outline-none transition">

    </div>

    <!-- Verify Button -->
    <button class="w-full py-3 rounded-lg text-white
      bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500
      hover:scale-105 active:scale-95
      transition duration-300 shadow-lg">

      Verify

    </button>

    <!-- Resend -->
    <div class="mt-6 text-white text-sm">
      Didn't receive code?
      <a href="#" class="underline hover:text-white transition">
        Resend
      </a>
    </div>

    <!-- Back -->
    <div class="mt-2 text-white text-sm">
      <a href="login.html" class="underline hover:text-white transition">
        Back to Login
      </a>
    </div>

  </div>

</body>
</html>
