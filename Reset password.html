<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      font-weight: 400;
    }
  </style>
</head>

<body class="bg-gradient-to-b from-purple-400 to-blue-200 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm text-center">

    <!-- Heading -->
    <h2 class="text-white text-3xl sm:text-4xl font-light mb-3 tracking-wide">
      Reset Password
    </h2>

    <!-- Subtitle -->
    <p class="text-white/80 text-sm sm:text-base mb-8">
      Enter your details below
    </p>

    <!-- Email -->
    <div class="mb-6">
      <input
        type="email"
        placeholder="Email ID"
        class="w-full bg-transparent border-b border-white/70 outline-none text-white placeholder-white/60 pb-2 focus:border-white">
    </div>

    <!-- New Password -->
    <div class="mb-6">
      <input
        type="password"
        placeholder="New Password"
        class="w-full bg-transparent border-b border-white/70 outline-none text-white placeholder-white/60 pb-2 focus:border-white">
    </div>

    <!-- Confirm Password -->
    <div class="mb-8">
      <input
        type="password"
        placeholder="Confirm Password"
        class="w-full bg-transparent border-b border-white/70 outline-none text-white placeholder-white/60 pb-2 focus:border-white">
    </div>

    <!-- Button -->
    <button
      type="button"
      onclick="window.location.href='login.html';"
      class="w-full bg-blue-500/90 text-white py-3 rounded-md hover:bg-blue-600 transition cursor-pointer">

      RESET PASSWORD

    </button>

    <!-- Login Link -->
    <div class="mt-6 text-white text-sm">
      Back to
      <a href="login.html" class="underline hover:text-white/80 transition">
        Login
      </a>
    </div>

  </div>

</body>
</html>
