<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Nunito", sans-serif;
      font-weight: 400;
    }
  </style>
</head>

<body class="bg-gradient-to-b from-purple-400 to-blue-300 min-h-screen flex items-center justify-center p-4">


  <div class="w-full max-w-sm px-6 py-8 rounded-2xl
              bg-white/10 backdrop-blur-xl
              shadow-xl border border-white/20
              text-center">

    
    <h2 class="text-white text-3xl sm:text-4xl font-light mb-2 tracking-wide">
      Forgot Password
    </h2>

    
    <p class="text-white/70 text-sm sm:text-base mb-8">
      Enter your email to get reset link
    </p>

    
    <div class="relative mb-10">
      <input
        type="email"
        required
        class="peer w-full bg-transparent border-b border-white/50
               text-white placeholder-transparent pb-2 outline-none
               focus:border-white transition">

      <label class="absolute left-0 top-2 text-white/60 text-sm
                    transition-all
                    peer-focus:-top-4 peer-focus:text-xs peer-focus:text-white
                    peer-valid:-top-4 peer-valid:text-xs">
        Email ID
      </label>
    </div>

  
    <button
      onclick="window.location.href='otp.html'"
      class="w-full py-3 rounded-lg text-white
             bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500
             hover:scale-105 active:scale-95
             transition duration-300 shadow-lg cursor-pointer">

      Send OTP

    </button>

  
    <button
      onclick="window.location.href='Reset password.html'"
      class="w-full py-3 mt-4 rounded-lg text-white
             bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500
             hover:scale-105 active:scale-95
             transition duration-300 shadow-lg cursor-pointer">

      Send RESET PASSWORD

  </button>
    <div class="flex items-center my-6">
      <div class="flex-1 h-px bg-white/20"></div>
      <span class="px-3 text-white/50 text-xs">or</span>
      <div class="flex-1 h-px bg-white/20"></div>
    </div>

    
    <div class="text-white text-sm">
      Remember password?
      <a href="login.html" class="underline hover:text-white transition">
        Login
      </a>
    </div>

  </div>

</body>
</html>
