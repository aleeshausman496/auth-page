<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      font-weight: 400;
    }
  </style>
</head>

<body class="bg-gradient-to-b from-purple-400 to-blue-300 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm text-center">

    <!-- User Icon -->
    <div class="flex justify-center mb-6">
      <div class="relative w-16 h-16 rounded-full border-2 border-white flex flex-col items-center justify-center">

        <div class="w-4 h-4 bg-white rounded-full"></div>

        <div class="absolute mt-7 w-8 h-4 border-t-2 border-white rounded-full"></div>

      </div>
    </div>

    <!-- Heading -->
    <h2 class="text-white text-3xl sm:text-4xl font-light mb-8 tracking-wide">
      User Login
    </h2>

    <!-- Email -->
    <div class="mb-6">
      <input
        type="email"
        placeholder="Email ID"
        class="w-full bg-transparent border-b border-white outline-none text-white placeholder-white/70 pb-2"
      >
    </div>

    <!-- Password -->
    <div class="mb-6">
      <input
        type="password"
        placeholder="Password"
        class="w-full bg-transparent border-b border-white outline-none text-white placeholder-white/70 pb-2"
      >
    </div>

    <!-- Remember + Forgot -->
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 text-white text-sm mb-6">

      <label class="flex items-center gap-2">
        <input type="checkbox">
        Remember me
      </label>

      <a href="Forgot password.html" class="hover:underline">
        Forgot?
      </a>

    </div>

    <!-- Login Button -->
    <button
      type="button"
      onclick="window.location.href='login.html';"
      class="w-full bg-blue-500/90 text-white py-3 rounded-md hover:bg-blue-600 transition cursor-pointer">

      Login

    </button>

    <!-- Signup -->
    <div class="mt-6 text-white text-sm">
      Don't have an account?
      <a href="signup.html" class="underline">
        Sign up
      </a>
    </div>

  </div>

</body>
</html>
